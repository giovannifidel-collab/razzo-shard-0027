name: RAZZO Public Worker V7
on:
  repository_dispatch:
    types: [razzo-work-item]
permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    env:
      RAZZO_WORK_ITEM: ${{ toJson(github.event.client_payload) }}
      RAZZO_FABRIC_TOKEN: ${{ secrets.RAZZO_FABRIC_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: curl -fsSL https://raw.githubusercontent.com/giovannifidel-collab/pfarma-ci/main/razzo/public_fabric/shard_worker.py -o shard_worker.py
      - run: python shard_worker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: razzo-receipt-${{ github.event.client_payload.workItemId }}, path: receipt.json}
      - name: Return sanitized receipt
        if: always()
        env:
          TOKEN: ${{ secrets.RAZZO_FABRIC_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          r=json.load(open('receipt.json'))
          envelope={'schema':'razzo.receipt-envelope.v1','workItemId':r['workItemId'],'receipt':r}
          q=urllib.request.Request('https://api.github.com/repos/giovannifidel-collab/pfarma-ci/dispatches', data=json.dumps({'event_type':'razzo-receipt','client_payload':envelope}).encode(), method='POST')
          q.add_header('Authorization',f"Bearer {os.environ['TOKEN']}"); q.add_header('Accept','application/vnd.github+json'); q.add_header('Content-Type','application/json')
          urllib.request.urlopen(q, timeout=30).read()
          PY
